name: Foundation CI

on:
  pull_request:
  push:
    branches:
      - architecture/foundation-v2

jobs:
  jvm-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Verify common foundation and runtime tests
        run: >-
          gradle
          :foundation:architecture:allTests
          :foundation:lifecycle:allTests
          :runtime:application:allTests
          :desktopApp:compileKotlinDesktop
          --stacktrace
      - name: Build Android host
        run: gradle :androidApp:assembleDebug --stacktrace

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Compile iOS runtime and simulator framework
        run: >-
          gradle
          :foundation:lifecycle:compileKotlinIosSimulatorArm64
          :runtime:application:compileKotlinIosSimulatorArm64
          :app:shared:linkDebugFrameworkIosSimulatorArm64
          --stacktrace

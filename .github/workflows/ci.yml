name: Foundation CI

on:
  pull_request:
    branches:
      - architecture/bootstrap

concurrency:
  group: foundation-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  jvm-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify JVM and Android architecture surface
        run: >-
          ./gradlew
          :foundation:architecture:allTests
          :foundation:lifecycle:allTests
          :foundation:configuration:allTests
          :foundation:time:allTests
          :foundation:localization:allTests
          :foundation:security:allTests
          :foundation:session:allTests
          :foundation:capabilities:allTests
          :foundation:observability:allTests
          :foundation:analytics:allTests
          :runtime:application:allTests
          :runtime:sdui:allTests
          :runtime:binding:allTests
          :runtime:form:allTests
          :runtime:action:allTests
          :data:network:allTests
          :data:sync:allTests
          :data:realtime:allTests
          :platform:background:desktopTest
          :platform:background:testAndroidHostTest
          :app:composition:desktopTest
          :app:composition:testAndroidHostTest
          :desktopApp:compileKotlinDesktop
          :androidApp:assembleDebug
          --warning-mode all
          --stacktrace

  ios:
    needs: jvm-android
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile iOS architecture surface
        run: >-
          ./gradlew
          :foundation:security:compileKotlinIosArm64
          :foundation:security:compileKotlinIosSimulatorArm64
          :foundation:session:compileKotlinIosArm64
          :foundation:session:compileKotlinIosSimulatorArm64
          :foundation:capabilities:compileKotlinIosArm64
          :foundation:capabilities:compileKotlinIosSimulatorArm64
          :foundation:observability:compileKotlinIosArm64
          :foundation:observability:compileKotlinIosSimulatorArm64
          :foundation:analytics:compileKotlinIosArm64
          :foundation:analytics:compileKotlinIosSimulatorArm64
          :runtime:application:compileKotlinIosArm64
          :runtime:application:compileKotlinIosSimulatorArm64
          :runtime:sdui:compileKotlinIosArm64
          :runtime:sdui:compileKotlinIosSimulatorArm64
          :runtime:action:compileKotlinIosArm64
          :runtime:action:compileKotlinIosSimulatorArm64
          :data:network:compileKotlinIosArm64
          :data:network:compileKotlinIosSimulatorArm64
          :data:sync:compileKotlinIosArm64
          :data:sync:compileKotlinIosSimulatorArm64
          :data:realtime:compileKotlinIosArm64
          :data:realtime:compileKotlinIosSimulatorArm64
          :platform:background:compileKotlinIosArm64
          :platform:background:compileKotlinIosSimulatorArm64
          :app:composition:compileKotlinIosArm64
          :app:composition:compileKotlinIosSimulatorArm64
          :app:composition:linkDebugFrameworkIosSimulatorArm64
          --warning-mode all
          --stacktrace

name: Foundation CI

on:
  pull_request:
    branches:
      - architecture/bootstrap

concurrency:
  group: foundation-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  jvm-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Verify common foundation and runtime tests
        run: >-
          gradle
          :foundation:architecture:allTests
          :foundation:lifecycle:allTests
          :foundation:configuration:allTests
          :foundation:time:allTests
          :foundation:localization:allTests
          :foundation:feature-control:allTests
          :runtime:application:allTests
          :desktopApp:compileKotlinDesktop
          --stacktrace
      - name: Build Android host
        run: gradle :androidApp:assembleDebug --stacktrace

  ios:
    needs: jvm-android
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Compile iOS foundation and runtime modules
        run: >-
          gradle
          :foundation:lifecycle:compileKotlinIosSimulatorArm64
          :foundation:configuration:compileKotlinIosSimulatorArm64
          :foundation:time:compileKotlinIosSimulatorArm64
          :foundation:localization:compileKotlinIosSimulatorArm64
          :foundation:feature-control:compileKotlinIosSimulatorArm64
          :runtime:application:compileKotlinIosSimulatorArm64
          :app:shared:linkDebugFrameworkIosSimulatorArm64
          --stacktrace

name: Foundation CI

on:
  pull_request:
    branches:
      - architecture/bootstrap
  push:
    branches:
      - architecture/foundation-v2
  workflow_dispatch:

concurrency:
  group: foundation-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jvm-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify repository JVM, Android and host-test surface
        run: >-
          ./gradlew
          allTests
          assemble
          --warning-mode all
          --stacktrace

  ios:
    needs: jvm-android
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile complete iOS KMP surface
        run: >-
          ./gradlew
          compileKotlinIosArm64
          compileKotlinIosSimulatorArm64
          :app:composition:linkDebugFrameworkIosSimulatorArm64
          --warning-mode all
          --stacktrace

name: Foundation CI

on:
  pull_request:
    branches:
      - development
      - main
  push:
    branches:
      - development
      - main
  workflow_dispatch:

concurrency:
  group: foundation-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jvm-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify repository JVM, Android and host-test surface
        run: >-
          ./gradlew
          verifyStartupArchitecture
          allTests
          assemble
          --warning-mode all
          --stacktrace

  published-foundation-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish neutral foundation to clean build-local repository
        run: >-
          ./gradlew
          verifyFoundationCoordinates
          publishFoundationToLocalRepository
          --warning-mode all
          --stacktrace
      - name: Verify Partner consumes published leaf foundation cluster
        run: >-
          ./gradlew
          :app:composition:testAndroidHostTest
          :app:composition:desktopTest
          -Pcarbroz.foundation.consumePublished=true
          --warning-mode all
          --stacktrace

  ios:
    needs:
      - jvm-android
      - published-foundation-boundary
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile complete iOS KMP surface
        run: >-
          ./gradlew
          compileKotlinIosArm64
          compileKotlinIosSimulatorArm64
          :app:composition:linkDebugFrameworkIosSimulatorArm64
          --warning-mode all
          --stacktrace
      - name: Build native iOS Debug host
        run: |
          xcodebuild \
            -project iosApp/CarBrozPartner.xcodeproj \
            -scheme CarBrozPartner \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Build native iOS Staging host
        run: |
          xcodebuild \
            -project iosApp/CarBrozPartner.xcodeproj \
            -scheme CarBrozPartner \
            -sdk iphonesimulator \
            -configuration Staging \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Publish neutral foundation for iOS artifact-boundary verification
        run: >-
          ./gradlew
          verifyFoundationCoordinates
          publishFoundationToLocalRepository
          --warning-mode all
          --stacktrace
      - name: Verify Partner consumes published leaf foundation cluster on iOS
        run: >-
          ./gradlew
          :app:composition:compileKotlinIosArm64
          :app:composition:compileKotlinIosSimulatorArm64
          -Pcarbroz.foundation.consumePublished=true
          --warning-mode all
          --stacktrace

name: Foundation CI

on:
  pull_request:
  push:
    branches:
      - architecture/foundation-v2

jobs:
  jvm-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify foundation and desktop
        run: ./gradlew :foundation:architecture:allTests :desktopApp:compileKotlinDesktop --stacktrace
      - name: Build Android host
        run: ./gradlew :androidApp:assembleDebug --stacktrace

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile iOS simulator framework
        run: ./gradlew :app:shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace
